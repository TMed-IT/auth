name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=moderate

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-${{ matrix.site }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: external
            env_file: .env.external
          - site: internal
            env_file: .env.internal
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOTENV_PRIVATE_KEY_EXTERNAL: ${{ secrets.DOTENV_PRIVATE_KEY_EXTERNAL }}
      DOTENV_PRIVATE_KEY_INTERNAL: ${{ secrets.DOTENV_PRIVATE_KEY_INTERNAL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate ${{ matrix.site }} environment
        id: validate
        env:
          SITE_NAME: ${{ matrix.site }}
          ENV_SOURCE: ${{ matrix.env_file }}
        run: |
          umask 077
          env_file="$RUNNER_TEMP/deploy-env.json"
          trap 'rm -f "$env_file"' EXIT

          if ! pnpm exec dotenvx get -f "$ENV_SOURCE" --format=json > "$env_file"; then
            if [[ "$SITE_NAME" == "internal" ]]; then
              echo "Internal deployment is disabled until .env.internal and DOTENV_PRIVATE_KEY_INTERNAL are configured."
              echo "configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          invalid_variables="$(jq -nr --arg site "$SITE_NAME" --slurpfile env "$env_file" '
            (["AUTH_URL","SESSION_MAX_AGE","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET",
              "D1_DATABASE_NAME","D1_DATABASE_ID","R2_AVATAR_BUCKET_NAME"]
             + if $site == "external" then ["AUTH_EMAIL_ALLOW_REGEX"] else [] end)
            | map(select(
                (($env[0][.] // "") | length) == 0 or
                (($env[0][.] // "") | startswith("REPLACE_WITH_"))
              ))
            | join(", ")
          ')"
          if [[ -n "$invalid_variables" ]]; then
            if [[ "$SITE_NAME" == "internal" ]]; then
              echo "Internal deployment is disabled until these variables are configured: $invalid_variables"
              echo "configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Missing deployment variables for $SITE_NAME: $invalid_variables"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build, generate secrets, initialize D1, and deploy ${{ matrix.site }}
        if: steps.validate.outputs.configured == 'true'
        env:
          SITE_NAME: ${{ matrix.site }}
        run: pnpm run "deploy:$SITE_NAME"
