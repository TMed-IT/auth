name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decrypt .env
        env:
          DOTENVX_KEY: ${{ secrets.DOTENVX_KEY }}
        run: pnpm exec dotenvx decrypt --file .env

      - name: Generate wrangler.jsonc
        run: |
          pnpm exec dotenvx run --env-file=.env -- node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          
          config.vars = {
            'AUTH_URL': process.env.AUTH_URL,
            'FRONTEND_URL': process.env.FRONTEND_URL,
            'AUTH_COOKIE_DOMAIN': process.env.AUTH_COOKIE_DOMAIN,
            'AUTH_TOKEN_MAX_AGE': process.env.AUTH_TOKEN_MAX_AGE,
            'AUTH_EMAIL_ALLOW_REGEX': process.env.AUTH_EMAIL_ALLOW_REGEX,
            'NEXTJS_ENV': process.env.NEXTJS_ENV,
            'GOOGLE_CLIENT_ID': process.env.GOOGLE_CLIENT_ID,
            'NEXT_PUBLIC_TERMS_URL': process.env.NEXT_PUBLIC_TERMS_URL,
            'NEXT_PUBLIC_PRIVACY_POLICY_URL': process.env.NEXT_PUBLIC_PRIVACY_POLICY_URL,
            'NEXT_PUBLIC_SUPPORT_EMAIL': process.env.NEXT_PUBLIC_SUPPORT_EMAIL
          };
          
          config.d1_databases = [
            {
              'binding': 'DB',
              'database_name': process.env.D1_DATABASE_NAME,
              'database_id': process.env.D1_DATABASE_ID
            }
          ];
          
          config.routes = [
            {
              'pattern': 'auth.tmedit.org/*',
              'zone_name': 'tmedit.org'
            }
          ];
          
          config.workers_dev = false;
          
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, '\t'));
          "

      - name: Build with OpenNext
        run: pnpm exec dotenvx run --env-file=.env -- pnpm exec opennextjs-cloudflare build

      - name: Set Cloudflare Secrets
        run: |
          pnpm exec dotenvx run --env-file=.env -- bash -lc '
            set -euo pipefail
            [ -n "${JWT_SECRET:-}" ] || { echo "Error: JWT_SECRET is missing"; exit 1; }
            [ -n "${ENCRYPTION_SECRET:-}" ] || { echo "Error: ENCRYPTION_SECRET is missing"; exit 1; }
            [ -n "${CSRF_SECRET:-}" ] || { echo "Error: CSRF_SECRET is missing"; exit 1; }
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] || { echo "Error: GOOGLE_CLIENT_SECRET is missing"; exit 1; }
            printf %s "$JWT_SECRET" | wrangler secret put JWT_SECRET
            printf %s "$ENCRYPTION_SECRET" | wrangler secret put ENCRYPTION_SECRET
            printf %s "$CSRF_SECRET" | wrangler secret put CSRF_SECRET
            printf %s "$GOOGLE_CLIENT_SECRET" | wrangler secret put GOOGLE_CLIENT_SECRET
          '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

