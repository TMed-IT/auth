name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate wrangler.jsonc
        env:
          AUTH_URL: ${{ vars.AUTH_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          AUTH_COOKIE_DOMAIN: ${{ vars.AUTH_COOKIE_DOMAIN }}
          AUTH_TOKEN_MAX_AGE: ${{ vars.AUTH_TOKEN_MAX_AGE }}
          AUTH_EMAIL_ALLOW_REGEX: ${{ vars.AUTH_EMAIL_ALLOW_REGEX }}
          NEXTJS_ENV: ${{ vars.NEXTJS_ENV }}
          NEXT_PUBLIC_TERMS_URL: ${{ vars.NEXT_PUBLIC_TERMS_URL }}
          NEXT_PUBLIC_PRIVACY_POLICY_URL: ${{ vars.NEXT_PUBLIC_PRIVACY_POLICY_URL }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          
          config.vars = {
            'AUTH_URL': process.env.AUTH_URL,
            'FRONTEND_URL': process.env.FRONTEND_URL,
            'AUTH_COOKIE_DOMAIN': process.env.AUTH_COOKIE_DOMAIN,
            'AUTH_TOKEN_MAX_AGE': parseInt(process.env.AUTH_TOKEN_MAX_AGE, 10),
            'AUTH_EMAIL_ALLOW_REGEX': process.env.AUTH_EMAIL_ALLOW_REGEX,
            'NEXTJS_ENV': process.env.NEXTJS_ENV,
            'NEXT_PUBLIC_TERMS_URL': process.env.NEXT_PUBLIC_TERMS_URL,
            'NEXT_PUBLIC_PRIVACY_POLICY_URL': process.env.NEXT_PUBLIC_PRIVACY_POLICY_URL,
            'NEXT_PUBLIC_SUPPORT_EMAIL': process.env.NEXT_PUBLIC_SUPPORT_EMAIL,
            'JWT_SECRET': process.env.JWT_SECRET,
            'ENCRYPTION_SECRET': process.env.ENCRYPTION_SECRET,
            'CSRF_SECRET': process.env.CSRF_SECRET,
            'GOOGLE_CLIENT_ID': process.env.GOOGLE_CLIENT_ID,
            'GOOGLE_CLIENT_SECRET': process.env.GOOGLE_CLIENT_SECRET
          };
          
          config.d1_databases = [
            {
              'binding': 'DB',
              'database_name': process.env.D1_DATABASE_NAME,
              'database_id': process.env.D1_DATABASE_ID
            }
          ];
          
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, '\t'));
          "

      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

