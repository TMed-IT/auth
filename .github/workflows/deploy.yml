name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm exec tsc --noEmit
          pnpm audit --prod --audit-level=moderate

      - name: Build and deploy
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENVX_KEY }}
        run: |
          umask 077
          env_file="$RUNNER_TEMP/deploy-env.json"
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          config_file="$PWD/wrangler.deploy.json"
          trap 'rm -f "$env_file" "$secrets_file" "$config_file"' EXIT

          pnpm exec dotenvx get -f .env --format=json > "$env_file"
          missing_variables="$(jq -nr --slurpfile env "$env_file" '
            ["AUTH_URL","AUTH_TOKEN_MAX_AGE","AUTH_EMAIL_ALLOW_REGEX",
             "GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","JWT_SECRET",
             "ENCRYPTION_SECRET","CSRF_SECRET","D1_DATABASE_NAME","D1_DATABASE_ID"]
            | map(select((($env[0][.] // "") | length) == 0))
            | join(", ")
          ')"
          if [[ -n "$missing_variables" ]]; then
            echo "Missing deployment variables: $missing_variables"
            exit 1
          fi

          jq --slurpfile env "$env_file" '
            $env[0] as $e
            | ($e.AUTH_URL | capture("^https://(?<host>[^/:?#]+)$").host) as $host
            | ($host | split(".")) as $labels
            | (if ($labels | length) >= 3 then ($labels[1:] | join(".")) else $host end) as $zone
            | .vars = ({
                AUTH_URL: $e.AUTH_URL,
                AUTH_TRUSTED_ORIGINS: $e.AUTH_TRUSTED_ORIGINS,
                AUTH_TOKEN_MAX_AGE: ($e.AUTH_TOKEN_MAX_AGE | tonumber),
                AUTH_EMAIL_ALLOW_REGEX: $e.AUTH_EMAIL_ALLOW_REGEX,
                NEXTJS_ENV: "production",
                GOOGLE_CLIENT_ID: $e.GOOGLE_CLIENT_ID,
                NEXT_PUBLIC_TERMS_URL: $e.NEXT_PUBLIC_TERMS_URL,
                NEXT_PUBLIC_PRIVACY_POLICY_URL: $e.NEXT_PUBLIC_PRIVACY_POLICY_URL,
                NEXT_PUBLIC_SUPPORT_EMAIL: $e.NEXT_PUBLIC_SUPPORT_EMAIL
              } | with_entries(select(.value != null and .value != "")))
            | .d1_databases = [{
                binding: "DB",
                database_name: $e.D1_DATABASE_NAME,
                database_id: $e.D1_DATABASE_ID
              }]
            | .routes = [{ pattern: ($host + "/*"), zone_name: $zone }]
            | .workers_dev = false
          ' wrangler.jsonc > "$config_file"

          jq '{JWT_SECRET,ENCRYPTION_SECRET,CSRF_SECRET,GOOGLE_CLIENT_SECRET}' \
            "$env_file" > "$secrets_file"
          pnpm exec dotenvx run -f .env -- pnpm exec opennextjs-cloudflare build \
            --config "$config_file"
          pnpm exec dotenvx run -f .env -- pnpm exec opennextjs-cloudflare deploy \
            --config "$config_file" --secrets-file "$secrets_file"
