allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.17 || 1.1.18
  - postcss@8.5.23
  - js-yaml@4.3.1 || 4.3.2
  - nanoid@3.3.18
  - browserslist@4.28.7
  - wrangler@4.147.0

overrides:
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  browserslist: 4.29.0
  postcss: 8.5.23
  # GHSA-wq5f-xc86-pv6w: Miniflare pins an affected sharp release.
  sharp: 0.35.5
  # GHSA-68fv-2mgg-jv7q: update PostCSS and Tailwind's transitive dependency.
  source-map-js: 1.2.2
  # GHSA-vfj7-8cjw-p6xm has no fixed braces release. The Next.js ESLint
  # plugin only uses globSync(pattern, { onlyDirectories: true }), which
  # tinyglobby supports. Limit the replacement to that plugin.
  "@next/eslint-plugin-next>fast-glob": npm:tinyglobby@0.2.17
  # GHSA-27r3-jxmh-p828: Express allows the patched body-parser release,
  # but the OpenNext dependency lock can otherwise retain the affected one.
  "express>body-parser": 2.4.0
  # GHSA-3g3m-2fjr-6pw4: OpenNext and node-minify currently declare glob
  # ranges that stop before the patched major release.
  "@opennextjs/cloudflare>glob": 14.0.2
  "@node-minify/core>glob": 14.0.2
  # GHSA-g3hv-75wg-m249: upstream ESLint packages still declare affected
  # minimatch majors. Keep the override limited to the direct parents.
  "@typescript-eslint/typescript-estree>minimatch": 11.0.3
  "@eslint/config-array>minimatch": 11.0.3
  "@eslint/eslintrc>minimatch": 11.0.3
  "eslint>minimatch": 11.0.3
  "eslint-plugin-import>minimatch": 11.0.3
  "eslint-plugin-jsx-a11y>minimatch": 11.0.3
  "eslint-plugin-react>minimatch": 11.0.3
