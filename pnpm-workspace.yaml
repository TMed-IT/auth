allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.17 || 1.1.18
  - postcss@8.5.23
  - js-yaml@4.3.1 || 4.3.2
  - nanoid@3.3.18
  - browserslist@4.28.7
  - wrangler@4.147.0

overrides:
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  browserslist: 4.29.0
  postcss: 8.5.23
  # GHSA-wq5f-xc86-pv6w: Miniflare pins an affected sharp release.
  sharp: 0.35.5
  # GHSA-68fv-2mgg-jv7q: update PostCSS and Tailwind's transitive dependency.
  source-map-js: 1.2.2
  # GHSA-vfj7-8cjw-p6xm has no fixed braces release. The Next.js ESLint
  # plugin only uses globSync(pattern, { onlyDirectories: true }), which
  # tinyglobby supports. Limit the replacement to that plugin.
  "@next/eslint-plugin-next>fast-glob": npm:tinyglobby@0.2.17
  # GHSA-5j98-mcp5-4vw2: @node-minify/core pins an affected glob release.
  "glob@10.3.3": 10.5.0
  body-parser@2.3.0: 2.4.0
  undici@7.29.1: 7.30.1
